version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: manzilcart_postgres
    restart: always
    environment:
      POSTGRES_DB: manzilcart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: manzilcart_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: